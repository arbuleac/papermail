<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quire Specimen</title>
<style>
/* ===== Quire tokens: generated from docs/design/tokens.json (names match: color.paper -> --q-paper) ===== */
{{CSS_TOKENS}}
/* Specimen-only scopes: one panel shows the increased-contrast values regardless of the system setting. */
{{CSS_IC_SCOPE:.ic}}
:root{--q-knob-shadow:{{layout.toggle.knobShadow.light}}}
@media (prefers-color-scheme:dark){:root{--q-knob-shadow:{{layout.toggle.knobShadow.dark}}}}
.ic{--q-knob-shadow:{{layout.toggle.knobShadow.lightHC}}}
@media (prefers-color-scheme:dark){.ic{--q-knob-shadow:{{layout.toggle.knobShadow.darkHC}}}}
/* Specimen-only scopes: every theme's Light and Dark variables (§4.16), for the Themes band, whatever the page's own appearance. */
{{CSS_THEME_SCOPES:.tb}}
/* ===== SF Symbols, rasterised to template masks (the reader-shell pipeline) ===== */
{{PART:SYMBOL_CSS}}

:root{--studio:#E3DFD7;--studio-ink:#2E2B27;--studio-ink2:#5E5850;--studio-rule:#CCC6BB;--studio-card:#EFECE6;
  --win-shadow:0 0 0 .5px rgba(0,0,0,.24),0 24px 70px rgba(40,34,26,.22),0 8px 22px rgba(40,34,26,.10);
  --menu-bg:#F7F6F3;--menu-edge:rgba(0,0,0,.12);--lights-idle:#D2CEC7;--alert-bg:#F2F0EC;--notif-bg:rgba(246,245,242,.96)}
@media (prefers-color-scheme:dark){:root{--studio:#0B0B0A;--studio-ink:#DAD5CC;--studio-ink2:#A09A90;--studio-rule:#2B2926;--studio-card:#141312;
  --win-shadow:0 0 0 1px rgba(255,255,255,.10),0 24px 70px rgba(0,0,0,.65),0 8px 22px rgba(0,0,0,.45);
  --menu-bg:#2A2825;--menu-edge:rgba(255,255,255,.12);--lights-idle:#4A4743;--alert-bg:#2A2825;--notif-bg:rgba(44,42,38,.96)}}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--studio)}
body{background:var(--studio);color:var(--studio-ink);font:var(--q-font-body);-webkit-font-smoothing:antialiased}
.page{width:1280px;margin:0 auto;padding:0 0 96px}
code{font:11px/14px var(--q-mono)}
.sym{display:inline-block;flex:none;width:calc(var(--pt) * 1.3);height:calc(var(--pt) * 1.3);background:currentColor;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;vertical-align:middle}
.glyph{flex:none;display:inline-block;vertical-align:middle;overflow:visible}

/* ----- page furniture ----- */
.cover{padding:64px 0 8px;display:grid;grid-template-columns:1fr 430px;gap:56px;align-items:end}
.cover .k{font:var(--q-font-runningHead);letter-spacing:.6px;text-transform:uppercase;color:var(--studio-ink2);display:flex;gap:10px;align-items:center}
.cover h1{font:600 60px/66px var(--q-serif);letter-spacing:-1.4px;white-space:nowrap;margin:14px 0 14px;color:var(--studio-ink)}
.cover h1 em{font-weight:400;font-style:italic}
.cover p{font:400 17px/26px var(--q-serif);color:var(--studio-ink2);max-width:660px}
.cover ol{list-style:none;counter-reset:p;display:grid;gap:12px;border-left:1px solid var(--studio-rule);padding-left:20px}
.cover li{counter-increment:p;font:13px/19px var(--q-sans);color:var(--studio-ink2)}
.cover li b{display:block;font:600 14px/19px var(--q-serif);color:var(--studio-ink)}
.cover li b::before{content:counter(p) ". ";font-weight:400;color:var(--studio-ink2)}
.sh{margin:64px 0 22px;display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--studio-rule);padding-top:16px}
.sh .n{font:var(--q-font-runningHead);letter-spacing:.6px;text-transform:uppercase;color:var(--studio-ink2);width:120px;flex:none}
.sh h2{font:600 30px/36px var(--q-serif);letter-spacing:-.5px;color:var(--studio-ink)}
.sh p{margin-left:auto;max-width:520px;text-align:right;font:13px/18px var(--q-sans);color:var(--studio-ink2)}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:22px}
.notes div{border-top:1px solid var(--studio-rule);padding-top:10px;font:12px/17px var(--q-sans);color:var(--studio-ink2)}
.notes b{display:block;font:600 13px/18px var(--q-serif);color:var(--studio-ink);margin-bottom:2px}
.notes b i{font-style:normal;font:600 11px/14px var(--q-sans);color:var(--q-accent);margin-right:6px}

/* ----- window chrome ----- */
.win{position:relative;overflow:hidden;border-radius:12px;background:var(--q-paper);box-shadow:var(--win-shadow);color:var(--q-ink)}
.lights{position:absolute;left:20px;top:20px;display:flex;gap:8px;z-index:9}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.lights.idle i{background:var(--lights-idle)}
.lights.t8{top:8px;left:8px}
.titlebar{height:28px;display:flex;align-items:center;justify-content:center;font:600 13px/16px var(--q-sans);color:var(--q-ink2);background:var(--q-paper);box-shadow:inset 0 -1px 0 var(--q-rule)}

/* ----- rail ----- */
.rail{position:absolute;left:0;top:0;bottom:0;width:76px;background:var(--q-spine);box-shadow:inset -1px 0 0 var(--q-rule)}
.rt{position:absolute;left:19px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;color:var(--q-ink2)}
.rt.sel{background:var(--q-raised);color:var(--q-ink);box-shadow:0 0 0 1px var(--q-rule),var(--q-e1)}
.rt.hov::before{content:'';position:absolute;inset:-3px;border-radius:12px;background:var(--q-hover)}
.rt .mr{position:absolute;left:-19px;top:7px;width:3px;height:24px;border-radius:0 2px 2px 0;background:var(--q-selRule)}
.rt .mr.idle{background:var(--q-selRuleIdle)}
.face{position:relative;width:30px;height:30px;border-radius:50%;background:var(--q-sheet);display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--q-serif);color:var(--q-ink);box-shadow:0 0 0 2px var(--fg,var(--q-spine)),0 0 0 4px var(--a)}
.face::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--a);opacity:{{layout.rail.faceAlpha}}}
.face span{position:relative}
.face.two{font-size:12px}
.badge{position:absolute;top:-5px;right:-8px;height:16px;min-width:16px;padding:0 5px;border-radius:8px;background:var(--q-accentFill);color:var(--q-onAccent);font:var(--q-font-badge);font-variant-numeric:tabular-nums;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--cut,var(--q-spine));z-index:2}
.badge.attn{background:var(--q-dangerFill);color:var(--q-onDanger);width:16px;padding:0;display:flex;align-items:center;justify-content:center}
.rdiv{position:absolute;left:28px;width:20px;height:1px;background:var(--q-rule)}
.rutil{position:absolute;left:24px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--q-ink2);border-radius:6px}
.rail .spin{position:absolute;top:-6px;right:-8px}
.rclip{position:absolute;left:0;width:76px;overflow:hidden}
.rclip.edge-top{box-shadow:inset 0 1px 0 var(--q-rule)}
.rclip.edge-bottom{box-shadow:inset 0 -1px 0 var(--q-rule)}
.rclip.edge-top.edge-bottom{box-shadow:inset 0 1px 0 var(--q-rule),inset 0 -1px 0 var(--q-rule)}

/* ----- list ----- */
.list{position:absolute;left:76px;top:0;bottom:0;width:364px;background:var(--q-paper);overflow:hidden}
.list::after{content:'';position:absolute;top:0;bottom:0;right:0;width:1px;background:var(--q-rule);z-index:4}
.list .sync{z-index:3}
.lh{position:relative;height:{{layout.listHeader.height}}px;box-shadow:inset 0 -1px 0 var(--q-rule)}
.mast{position:absolute;left:16px;top:14px;height:24px;display:flex;align-items:center;gap:6px;font:var(--q-font-masthead);letter-spacing:var(--q-track-masthead);color:var(--q-ink)}
.mast .sfx{font:var(--q-font-snippet);color:var(--q-ink3);letter-spacing:0;margin-left:2px}
.mast .sym{color:var(--q-ink2)}
.lh .compose{position:absolute;right:12px;top:12px}
.tabs{position:absolute;left:16px;bottom:0;height:40px;display:flex;gap:18px}
.tab{position:relative;display:flex;align-items:center;font:var(--q-font-label);color:var(--q-ink2)}
.tab.on{color:var(--q-ink);font-weight:600}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--q-ink)}
.tab.on.idle::after{background:var(--q-ink3)}
.tab.hov{color:var(--q-ink)}
.tab.dis{color:var(--q-inkDisabled)}
.tab.foc::before{content:'';position:absolute;left:-5px;right:-5px;top:9px;bottom:9px;border-radius:5px;box-shadow:0 0 0 2px var(--q-focus)}
.search{position:absolute;left:var(--sl,78px);right:48px;top:{{layout.listHeader.searchTop}}px;height:26px;border-radius:6px;background:var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);display:flex;align-items:center;gap:6px;padding:0 5px 0 8px;font:var(--q-font-body);color:var(--q-ink3)}
.search .ph{flex:1}
.search .kbd{height:16px;min-width:16px}

.row{position:relative;height:68px;--rowbg:var(--q-paper);background:var(--rowbg)}
.row::after{content:'';position:absolute;left:68px;right:0;bottom:0;height:1px;background:var(--q-rule)}
.row.sel{--rowbg:var(--q-selWash)}
.row.idle{--rowbg:var(--q-selWashIdle)}
.row.hov{background:linear-gradient(var(--q-hover),var(--q-hover)),var(--q-paper)}
.row.sel::after,.row.idle::after,.row.pre::after{display:none}
.mrule{display:none;position:absolute;left:0;top:8px;width:3px;height:52px;border-radius:0 2px 2px 0;background:var(--q-selRule)}
.row.sel .mrule{display:block}
.row.idle .mrule{display:block;background:var(--q-selRuleIdle)}
.pip{position:absolute;left:7px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--q-accent)}
.av{position:absolute;left:24px;top:19px;width:30px;height:30px;border-radius:50%;background:var(--face);color:var(--avink);font:600 12.5px/30px var(--q-serif);text-align:center;box-shadow:0 0 0 2px var(--rowbg),0 0 0 4px var(--ring)}
.l1,.l2,.l3{position:absolute;left:68px;right:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.l1{top:10px;height:16px}.l2{top:27px;height:18px;gap:6px}.l3{top:46px;height:15px}
.snd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font:var(--q-font-sender);color:var(--q-ink)}
.snd .me{color:var(--q-ink2)}
.unread .snd,.unread .sub{font-weight:600}
.tm{display:flex;align-items:center;gap:6px;flex:none}
.t{font:var(--q-font-meta);font-variant-numeric:tabular-nums;color:var(--q-ink3)}
.unread .t{color:var(--q-accent);font-weight:600}
.sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font:var(--q-font-subject);color:var(--q-ink)}
.sub.sans{font:var(--q-font-subjectSans)}
.cl{display:flex;align-items:center;gap:5px;flex:none}
.cnt{height:16px;min-width:18px;padding:0 5px;border-radius:8px;background:var(--q-fill);color:var(--q-ink2);font:var(--q-font-badge);font-variant-numeric:tabular-nums;line-height:16px;text-align:center}
.l3{font:var(--q-font-snippet);color:var(--q-ink2);display:block;overflow:hidden;text-overflow:ellipsis}
.rg{display:inline-flex;align-items:center;justify-content:center;width:12px;height:16px}
.rg .sym{--pt:12px}
.queued{color:var(--q-ink3)}.fail{color:var(--q-danger)}.clip{color:var(--q-ink2)}.starred{color:var(--q-star)}
.tag{height:16px;padding:0 5px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--q-ruleStrong);font:var(--q-font-tag);line-height:16px;color:var(--q-ink2)}
.atile{width:16px;height:16px;border-radius:{{layout.row.accountTileRadius}}px;box-shadow:inset 0 0 0 1.5px var(--a);font:600 11px/16px var(--q-sans);color:var(--q-ink2);text-align:center}
.row.compact{height:48px}
.row.compact::after{left:24px}
.row.compact .mrule{top:6px;height:36px}
.row.compact .pip{top:11.5px}
.row.compact .l1,.row.compact .l2{left:24px}
.row.compact .l1{top:7px}.row.compact .l2{top:25px}
.row.compact .sn{font:var(--q-font-snippet);color:var(--q-ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;margin-left:-6px}
.row.compact .sub{flex:none;max-width:60%}
.asq{width:6px;height:6px;border-radius:1.5px;background:var(--ring)}
.rhead{height:28px;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;font:var(--q-font-runningHead);letter-spacing:var(--q-track-runningHead);text-transform:uppercase;color:var(--q-ink3)}
.rhead i{flex:1;height:1px;background:var(--q-rule)}
.sync{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--q-paper);box-shadow:inset 0 1px 0 var(--q-rule);display:flex;align-items:center;gap:6px;padding:0 16px;font:var(--q-font-meta);color:var(--q-ink3);white-space:nowrap}
.sync b{font-weight:500;color:var(--q-ink2)}
.sync .sym{--pt:11px}
.sync.err,.sync.err b{color:var(--q-danger)}
.sync .act{margin-left:auto;color:var(--q-accent);font-weight:600}
.contrail{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,transparent 0,var(--c,var(--q-accent)) 32px)}
.contrail::after{content:'';position:absolute;right:-1px;top:-1px;width:4px;height:4px;border-radius:2px;background:var(--c,var(--q-accent))}

/* ----- reader ----- */
.reader{position:absolute;left:440px;top:0;right:0;bottom:0;background:var(--q-canvas);--colx:80px}
.rh{position:absolute;left:0;right:0;top:0;height:92px;background:var(--q-paper);box-shadow:inset 0 -1px 0 var(--q-rule)}
.kick{position:absolute;left:var(--colx);top:19px;height:14px;display:flex;align-items:center;gap:8px;font:var(--q-font-runningHead);letter-spacing:var(--q-track-runningHead);text-transform:uppercase;color:var(--q-ink3)}
.kick .dot{width:7px;height:7px;border-radius:50%;background:var(--a)}
.hl{position:absolute;left:var(--colx);right:var(--colx);top:56px;height:30px;font:var(--q-font-headline);letter-spacing:var(--q-track-headline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--q-ink)}
.acts{position:absolute;right:16px;top:12px;display:flex;gap:2px}
.acts .sp{width:10px}
.ib{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--q-ink2);flex:none;position:relative}
.ib.sm{width:22px;height:22px;border-radius:5px}
.ib.hov{background:var(--q-hover);color:var(--q-ink)}
.ib.prs{background:var(--q-pressed);color:var(--q-ink)}
.ib.on{color:var(--q-star)}
.ib.dis{color:var(--q-inkDisabled)}
.ib.foc{box-shadow:0 0 0 1px var(--q-paper),0 0 0 3px var(--q-focus)}
.desk{position:absolute;top:92px;left:0;right:0;bottom:60px;overflow:hidden}
.col{width:680px;margin:0 auto;padding-top:16px}
.parts{font:var(--q-font-body);color:var(--q-ink2);margin-bottom:16px}
.stack{background:var(--q-sheet);border-radius:8px;box-shadow:0 0 0 1px var(--q-rule);overflow:hidden}
.sr{position:relative;height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;white-space:nowrap}
.sr+.sr{box-shadow:inset 0 1px 0 var(--q-rule)}
.sr.hov{background:var(--q-hover)}
.sr.foc::after{content:'';position:absolute;inset:2px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--q-focus)}
.sr .avs{width:24px;height:24px;border-radius:50%;background:var(--face);color:var(--avink);font:600 10px/24px var(--q-serif);text-align:center;flex:none}
.sr .nm{width:112px;flex:none;overflow:hidden;text-overflow:ellipsis;font:500 13px/16px var(--q-sans)}
.sr.unread .nm{font-weight:600}
.sr .pp{position:absolute;left:5px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--q-accent)}
.sr .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font:400 13px/16px var(--q-sans);color:var(--q-ink2)}
.sr .dt{font:var(--q-font-meta);font-variant-numeric:tabular-nums;color:var(--q-ink3)}
.sr.fold{justify-content:center;font:var(--q-font-label);color:var(--q-ink2)}
.sheet{margin-top:12px;background:var(--q-sheet);border-radius:8px;box-shadow:0 0 0 1px var(--q-rule),var(--q-e1);padding:22px 28px 14px;position:relative}
.sheet.foc{box-shadow:0 0 0 1px var(--q-rule),0 0 0 2px var(--q-canvas),0 0 0 4px var(--q-focus)}
.mh{display:flex;gap:12px;align-items:flex-start}
.mh .avm{width:36px;height:36px;border-radius:50%;background:var(--face);color:var(--avink);font:600 15px/36px var(--q-serif);text-align:center;flex:none}
.mh .who{flex:1;min-width:0}
.mh .nl{font:600 13px/18px var(--q-sans);color:var(--q-ink);white-space:nowrap}
.mh .nl .ad{font:var(--q-font-meta);color:var(--q-ink3);margin-left:6px;font-weight:400}
.mh .nl .un{font:var(--q-font-snippet);line-height:16px;color:var(--q-ink2);margin-left:{{layout.reader.addressGap}}px;text-decoration:underline;text-decoration-thickness:{{layout.textStyle.linkUnderline}}px;text-underline-offset:{{layout.textStyle.linkUnderlineOffset}}px}
.mh .rc{font:var(--q-font-snippet);line-height:16px;color:var(--q-ink2)}
.mh .dt{font:var(--q-font-snippet);line-height:18px;font-variant-numeric:tabular-nums;color:var(--q-ink3);display:flex;gap:2px;align-items:center}
.bd{margin:18px 0 0 48px;max-width:576px;font:var(--q-font-reading);color:var(--q-ink)}
.bd p+p{margin-top:12px}
.qt{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 6px;border-radius:6px;background:var(--q-fill);font:var(--q-font-label);color:var(--q-ink2);white-space:nowrap}
.qt.hov{background:linear-gradient(var(--q-hover),var(--q-hover)),var(--q-fill);color:var(--q-ink)}
.qt.on{background:var(--q-accentWash);color:var(--q-accent)}
.qt.prs{background:linear-gradient(var(--q-pressed),var(--q-pressed)),var(--q-fill);color:var(--q-ink)}
.qt.on.hov{background:var(--q-accentWashHover);color:var(--q-accent)}.qt.on.prs{background:var(--q-accentWashPressed);color:var(--q-accent)}
.qt.foc{box-shadow:0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.ind{margin-left:48px}
.atts{display:flex;gap:8px;flex-wrap:wrap}
.ach{position:relative;height:{{layout.attachmentChip.height}}px;min-width:{{layout.attachmentChip.minWidth}}px;max-width:{{layout.attachmentChip.maxWidth}}px;border-radius:{{layout.attachmentChip.radius}}px;background:var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-rule);display:flex;align-items:center;gap:{{layout.attachmentChip.gap}}px;padding:0 {{layout.attachmentChip.padRight}}px 0 {{layout.attachmentChip.padLeft}}px;white-space:nowrap;overflow:hidden}
/* the chip's Download button (§5.17): last in the row, after the name and meta */
.ach > div{flex:1;min-width:0}
.ach .dlb{width:{{layout.attachmentChip.download}}px;height:{{layout.attachmentChip.download}}px;border-radius:{{layout.attachmentChip.downloadRadius}}px;margin-left:calc({{layout.attachmentChip.downloadGap}}px - {{layout.attachmentChip.gap}}px);display:flex;align-items:center;justify-content:center;color:var(--q-ink2);flex:none}
.ach .dlb.hov{background:var(--q-hover);color:var(--q-ink)} .ach .dlb.dis{color:var(--q-inkDisabled)}
.ach .dlb.foc{box-shadow:0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.achead{display:flex;align-items:center;gap:8px;height:{{layout.attachmentChip.head}}px;font:var(--q-font-meta);color:var(--q-ink3)}
.achead .linkb{font:var(--q-font-label);display:inline-flex;align-items:center}
.achead .linkb.dis{color:var(--q-inkDisabled)}
.ach .tl{width:28px;height:28px;border-radius:5px;background:var(--q-fill);display:flex;align-items:center;justify-content:center;color:var(--q-ink2);flex:none}
.ach .nm{font:var(--q-font-label);color:var(--q-ink);overflow:hidden;text-overflow:ellipsis}
.ach .mt{font:var(--q-font-meta);color:var(--q-ink3)}
.ach.hov{background:linear-gradient(var(--q-hover),var(--q-hover)),var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-ruleStrong)}
.ach.foc{box-shadow:inset 0 0 0 1px var(--q-rule),0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.ach.err .tl{color:var(--q-danger)} .ach.err .mt{color:var(--q-danger)}
.ach .prog{position:relative;width:120px;height:2px;margin-top:6px;background:var(--q-rule)}
.ft{display:flex;gap:4px;border-top:1px solid var(--q-rule);padding-top:10px}
.gb{height:28px;padding:0 10px 0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font:500 13px/16px var(--q-sans);color:var(--q-ink2);white-space:nowrap}
.gb.hov{background:var(--q-hover);color:var(--q-ink)}
.qr{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--q-paper);box-shadow:inset 0 1px 0 var(--q-rule)}
.qrf{position:absolute;left:var(--colx);right:var(--colx);top:11px;height:38px;border-radius:8px;background:var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);display:flex;align-items:center;gap:10px;padding:0 5px 0 12px;font:var(--q-font-writing);color:var(--q-ink3)}
.qrf .ph{flex:1}
.mono24{width:24px;height:24px;border-radius:50%;position:relative;background:var(--q-sheet);display:inline-flex;align-items:center;justify-content:center;font:600 10px/1 var(--q-serif);color:var(--q-ink);box-shadow:0 0 0 {{border.accountRing.gap}}px var(--q-sheet),0 0 0 4px var(--a);flex:none}
.qrf .mono24{font-size:{{layout.quickReply.faceMonogram}}px}
.mono24::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--a);opacity:{{layout.rail.faceAlpha}}}
.mono24 span{position:relative}

/* ----- controls ----- */
.kbd{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 4px;border-radius:{{layout.kbd.radius}}px;background:var(--q-raised);box-shadow:inset 0 0 0 1px var(--q-rule),inset 0 -1px 0 var(--q-rule);font:var(--q-font-kbd);color:var(--q-ink2);white-space:nowrap;flex:none}
.kbd.lg{height:24px;min-width:24px;font-size:12px;border-radius:5px;padding:0 6px}
.kbd.os{background:transparent;box-shadow:inset 0 0 0 1px var(--q-onSlipEdge);color:var(--q-onSlip2)}
.then{font:var(--q-font-meta);color:var(--q-ink3);margin:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;font:500 13px/16px var(--q-sans);white-space:nowrap;color:var(--q-ink);position:relative;flex:none}
.btn.sm{height:22px;padding:0 9px;border-radius:5px;font-size:12px;gap:5px}
.btn.lg{height:36px;padding:0 16px;border-radius:8px;font-size:14px;gap:8px}
.primary{background:var(--q-accentFill);color:var(--q-onAccent);font-weight:600}
.primary.hov{background:var(--q-accentFillHover)}.primary.prs{background:var(--q-accentFillPressed)}
.secondary{background:var(--q-raised);box-shadow:inset 0 0 0 1px var(--q-ruleStrong)}
.secondary.hov{background:linear-gradient(var(--q-hover),var(--q-hover)),var(--q-raised)}
.secondary.prs{background:linear-gradient(var(--q-pressed),var(--q-pressed)),var(--q-raised)}
.ghost{color:var(--q-ink2)}.ghost.hov{background:var(--q-hover);color:var(--q-ink)}.ghost.prs{background:var(--q-pressed);color:var(--q-ink)}
.destructive{background:var(--q-dangerFill);color:var(--q-onDanger);font-weight:600}
.destructive.hov{background:var(--q-dangerFillHover)}.destructive.prs{background:var(--q-dangerFillPressed)}
.linkb{color:var(--q-accent);padding:0 4px;height:24px}
.btn.dis{background:var(--q-fill);color:var(--q-inkDisabled);box-shadow:none}
.ghost.dis,.linkb.dis{background:none}
.btn.foc{box-shadow:0 0 0 1px var(--q-paper),0 0 0 3px var(--q-focus)}
.secondary.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--q-paper),0 0 0 3px var(--q-focus)}
.primary.foc,.destructive.foc{box-shadow:0 0 0 2px var(--q-paper),0 0 0 4px var(--q-focus)}
.btn.inact{background:var(--q-raised);color:var(--q-ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--q-ruleStrong)}
.spin{display:inline-block;width:var(--sz,12px);height:var(--sz,12px);border-radius:50%;border:var(--sw,calc(var(--sz,12px) / 8)) solid currentColor;border-right-color:transparent;opacity:.85;flex:none}
.c5 .st{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr) !important}
.c5 .st .field{width:100%}
.field{display:flex;align-items:center;height:28px;border-radius:6px;background:var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);padding:0 8px;font:var(--q-font-body);color:var(--q-ink);gap:6px;width:220px;position:relative}
.field .ph{color:var(--q-ink3)}
.field.hov{box-shadow:inset 0 0 0 1px var(--q-ink3)}
.field.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--fgap,var(--q-paper)),0 0 0 3px var(--q-focus)}
.field.err{box-shadow:inset 0 0 0 1.5px var(--q-danger)}
.field.dis{background:var(--q-fill);box-shadow:none;color:var(--q-inkDisabled)}
.field.mono{font:var(--q-font-mono)}
.caret{width:1.5px;height:16px;background:var(--q-accent)}
.help{display:flex;gap:4px;align-items:center;font:var(--q-font-meta);color:var(--q-danger);margin-top:5px}
.cb{width:14px;height:14px;border-radius:{{layout.checkbox.radius}}px;background:var(--q-sheet);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);display:inline-flex;align-items:center;justify-content:center;color:var(--q-onAccent);flex:none}
.cb.on{background:var(--q-accentFill);box-shadow:none}
.cb.rad{border-radius:50%}
.cb.rad.on::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--q-onAccent)}
.cb.mix::after{content:'';width:8px;height:2px;border-radius:1px;background:var(--q-onAccent)}
.cb.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.cb.on.foc{box-shadow:0 0 0 2px var(--q-sheet),0 0 0 4px var(--q-focus)}
.cb.dis{opacity:.45}
.tg{width:30px;height:18px;border-radius:9px;background:var(--q-fill);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);position:relative;flex:none}
.tg::after{content:'';position:absolute;left:{{layout.toggle.inset}}px;top:{{layout.toggle.inset}}px;width:{{layout.toggle.knob}}px;height:{{layout.toggle.knob}}px;box-sizing:border-box;border-radius:50%;background:var(--q-knob);border:{{layout.toggle.knobEdge}}px solid var(--q-ruleStrong);box-shadow:0 {{layout.toggle.knobShadow.y}}px {{layout.toggle.knobShadow.blur}}px var(--q-knob-shadow)}
.tg.on{background:var(--q-accentFill);box-shadow:none}.tg.on::after{left:14px}
.tg.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.tg.on.foc{box-shadow:0 0 0 2px var(--q-sheet),0 0 0 4px var(--q-focus)}
.tg.dis{opacity:.45}
.pop{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 6px 0 9px;border-radius:6px;background:var(--q-raised);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);font:var(--q-font-body);color:var(--q-ink);white-space:nowrap}
.pop .sym{color:var(--q-ink2)}
.pop.bare{background:none;box-shadow:none;padding-left:0}
.pop.hov{background:linear-gradient(var(--q-hover),var(--q-hover)),var(--q-raised)}
.pop.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.pop.dis{background:var(--q-fill);box-shadow:none;color:var(--q-inkDisabled)}.pop.dis .sym{color:var(--q-inkDisabled)}
.swatch{width:14px;height:14px;border-radius:50%;background:var(--a);flex:none}
.tok{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;background:var(--q-fill);font:var(--q-font-body);color:var(--q-ink);white-space:nowrap}
.tok.hov{background:var(--q-pressed)}
.tok.sel{background:var(--q-accentFill);color:var(--q-onAccent)}
.tok.sel.foc{box-shadow:0 0 0 2px var(--q-paper),0 0 0 4px var(--q-focus)}
.tok.bad{background:var(--q-dangerWash);color:var(--q-danger);box-shadow:inset 0 0 0 1px var(--q-danger);padding-left:6px}
.tok.dis{color:var(--q-inkDisabled)}
.cntb{height:16px;min-width:16px;padding:0 5px;border-radius:8px;font:var(--q-font-badge);font-variant-numeric:tabular-nums;line-height:16px;text-align:center;display:inline-block}
.cntb.acc{background:var(--q-accentFill);color:var(--q-onAccent)}
.cntb.neu{background:var(--q-fill);color:var(--q-ink2)}
.dotb{width:8px;height:8px;border-radius:50%;background:var(--q-accent);display:inline-block}
.attn{width:16px;height:16px;border-radius:50%;background:var(--q-dangerFill);color:var(--q-onDanger);display:inline-flex;align-items:center;justify-content:center}
.banner{display:flex;align-items:center;gap:8px;height:32px;border-radius:6px;padding:0 6px 0 10px;font:var(--q-font-snippet);line-height:16px;color:var(--q-ink);background:var(--q-fill)}
.banner .sym{color:var(--q-ink2)}
.banner .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner.info{background:var(--q-infoWash)}.banner.info .sym{color:var(--q-info)}
.banner.ok{background:var(--q-successWash)}.banner.ok .sym{color:var(--q-success)}
.banner.warn{background:var(--q-warningWash)}.banner.warn .sym{color:var(--q-warning)}
.banner.bad{background:var(--q-dangerWash)}.banner.bad .sym{color:var(--q-danger)}
.banner .linkb{font:var(--q-font-label)}

/* ----- slips ----- */
.slip{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 6px 0 14px;border-radius:8px;background:var(--q-slip);color:var(--q-onSlip);box-shadow:inset 0 0 0 1px var(--q-slipEdge),var(--q-e2);font:500 13px/16px var(--q-sans);white-space:nowrap;position:relative;overflow:hidden}
.slip .sym{color:var(--q-onSlip2)}
.slip .dv{width:1px;height:16px;background:var(--q-onSlipEdge)}
.slip .ua{display:inline-flex;align-items:center;gap:{{layout.toast.actionKeycapGap}}px;height:{{layout.toast.action}}px;padding:0 {{layout.toast.actionPadX}}px;border-radius:{{layout.toast.actionRadius}}px;font-weight:600}
.slip .ua.hov{background:var(--q-slipHover)}.slip .ua.prs{background:var(--q-slipPressed)}
.slip .ua.foc{box-shadow:0 0 0 2px var(--q-onSlip)}
.slip .ua.hov .kbd.os,.slip .ua.prs .kbd.os,.panel .ub.hov .kbd.os,.panel .ub.prs .kbd.os{color:var(--q-onSlip)}
.slip.na{padding-right:{{layout.toast.padRightNoAction}}px}
.slip .contrail{top:auto;bottom:0;--c:var(--q-onSlip)}
.panel{position:relative;width:{{layout.undoPanel.width}}px;height:{{layout.undoPanel.height}}px;border-radius:{{layout.undoPanel.radius}}px;background:var(--q-slip);color:var(--q-onSlip);box-shadow:inset 0 0 0 1px var(--q-slipEdge),var(--q-e3);display:flex;align-items:center;gap:{{layout.undoPanel.glyphGap}}px;padding:0 {{layout.undoPanel.padRight}}px 0 {{layout.undoPanel.padLeft}}px;overflow:hidden}
.panel .tx{flex:1;min-width:0}
.panel .t1{font:500 13px/16px var(--q-sans);font-variant-numeric:tabular-nums}
.panel .t2{font:var(--q-font-meta);color:var(--q-onSlip2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .ub{height:{{layout.undoPanel.action}}px;padding:0 {{layout.undoPanel.actionPadX}}px;border-radius:{{layout.undoPanel.actionRadius}}px;box-shadow:inset 0 0 0 1px var(--q-onSlipEdge);font:600 13px/26px var(--q-sans);display:inline-flex;gap:{{layout.undoPanel.actionKeycapGap}}px;align-items:center;flex:none}
.panel .ub.hov{background:var(--q-slipHover);box-shadow:none}.panel .ub.prs{background:var(--q-slipPressed);box-shadow:none}
.panel .contrail{top:auto;bottom:0;--c:var(--q-onSlip)}
.panel .sym{color:var(--q-onSlip2)}
.hud{width:220px;border-radius:12px;background:var(--q-slip);color:var(--q-onSlip);box-shadow:inset 0 0 0 1px var(--q-slipEdge),var(--q-e2);padding:12px}
.hud .hd{display:flex;align-items:center;gap:8px;font:600 13px/16px var(--q-sans);margin-bottom:6px}
.hud .r{display:flex;align-items:center;gap:8px;height:22px;font:var(--q-font-snippet);color:var(--q-onSlip2)}

/* ----- system chrome drawn for reference ----- */
.menu{width:236px;padding:5px;border-radius:10px;background:var(--menu-bg);box-shadow:0 0 0 .5px var(--menu-edge),var(--q-e2);font:var(--q-font-body);color:var(--q-ink)}
.mi{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:5px;white-space:nowrap}
.mi .sym{color:var(--q-ink2)}
.mi .ck{width:12px;display:inline-flex;color:var(--q-ink)}
.mi .kc{margin-left:auto;color:var(--q-ink3);font-variant-numeric:tabular-nums}
.mi.hi{background:var(--q-accentFill);color:var(--q-onAccent)}
.mi.hi .sym,.mi.hi .kc,.mi.hi .ck{color:var(--q-onAccent)}
.mi .mb{margin-left:auto;font:400 12px/16px var(--q-sans);font-variant-numeric:tabular-nums;color:var(--q-ink3);padding:0 6px;border-radius:8px;background:var(--q-fill)}
.mi .mb + .kc{margin-left:10px}
.mi.dis{color:var(--q-inkDisabled)}.mi.dis .sym,.mi.dis .kc{color:var(--q-inkDisabled)}
.msep{height:1px;margin:5px 8px;background:var(--q-rule)}
.alert{width:260px;border-radius:14px;background:var(--alert-bg);box-shadow:0 0 0 .5px var(--menu-edge),var(--q-e3);padding:20px 16px 16px;text-align:center;color:var(--q-ink)}
.alert .ic{width:52px;height:52px;margin:0 auto 10px}
.alert h4{font:700 13px/17px var(--q-sans);margin-bottom:6px}
.alert p{font:11px/15px var(--q-sans);color:var(--q-ink2)}
.alert .bs{display:grid;gap:8px;margin-top:16px}
.alert .ab{height:28px;border-radius:7px;font:500 13px/28px var(--q-sans);background:var(--q-raised);box-shadow:inset 0 0 0 .5px var(--menu-edge);color:var(--q-ink)}
.alert .ab.def{background:var(--q-accentFill);color:var(--q-onAccent);box-shadow:none}
.alert .ab.des{color:var(--q-danger)}
.tip{display:inline-flex;align-items:center;gap:10px;height:22px;padding:0 8px;border-radius:5px;background:var(--menu-bg);box-shadow:0 0 0 .5px var(--menu-edge),0 2px 8px rgba(0,0,0,.12);font:var(--q-font-snippet);color:var(--q-ink)}
.tip span{color:var(--q-ink3)}
.notif{width:344px;border-radius:16px;background:var(--notif-bg);box-shadow:0 0 0 .5px var(--menu-edge),var(--q-e2);padding:12px;display:flex;gap:10px;color:var(--q-ink)}
.notif .ni{width:36px;height:36px;flex:none}
.notif .nt{flex:1;min-width:0;font:12px/16px var(--q-sans)}
.notif .nt b{display:flex;justify-content:space-between;font:600 13px/17px var(--q-sans)}
.notif .nt b span{font:400 11px/17px var(--q-sans);color:var(--q-ink3)}
.notif .nt i{display:block;font-style:normal;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .nt em{display:block;font-style:normal;color:var(--q-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ----- composer & settings ----- */
.cf{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px 0 0;margin:0 0 0 16px;box-shadow:inset 0 -1px 0 var(--q-rule);font:var(--q-font-body);color:var(--q-ink);white-space:nowrap}
.cf.subj{height:42px}
.cf .cl{width:56px;text-align:right;font:var(--q-font-snippet);color:var(--q-ink3);margin-right:6px;flex:none}
.sc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--q-rule);background:var(--q-sheet);color:var(--q-ink2);white-space:nowrap}
.sc b{font:var(--q-font-label);color:var(--q-ink)}.sc i{font-style:normal;font:var(--q-font-meta);color:var(--q-ink3)}
.sc .rm{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--q-ink3);position:relative}
.sc .rm::before{content:'';position:absolute;width:16px;height:16px;border-radius:8px;background:var(--q-fill)}
.sc .rm .sym{position:relative}
.stabs{display:flex;justify-content:center;gap:4px;padding:2px 0 8px;box-shadow:inset 0 -1px 0 var(--q-rule);background:var(--q-canvas)}
.stabs span{width:76px;height:50px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--q-ink2)}
.stabs b{font:500 11px/14px var(--q-sans);color:var(--q-ink2)}
.stabs .on{background:var(--q-fill)}.stabs .on .sym{color:var(--q-accent)}.stabs .on b{color:var(--q-ink)}
.sgroup{background:var(--q-sheet);border-radius:8px;box-shadow:0 0 0 1px var(--q-rule);overflow:hidden}
.arow{height:{{layout.settings.accountRow}}px;display:flex;align-items:center;gap:calc({{layout.settings.accountHairlineX}}px - {{layout.settings.accountFaceX}}px - {{layout.settings.accountFace}}px);padding:0 {{layout.settings.statusTrailing}}px 0 {{layout.settings.accountFaceX}}px;position:relative}
.arow .an{margin-right:calc({{layout.settings.statusGap}}px - 16px)}
.arow+.arow::before{content:'';position:absolute;left:62px;right:0;top:0;height:1px;background:var(--q-rule)}
.arow.sel{background:var(--q-selWash)}
.arow.sel::after{content:'';position:absolute;left:0;top:0;bottom:0;width:{{border.marginRule.width}}px;background:var(--q-selRule)}
.arow.sel.idle{background:var(--q-selWashIdle)}.arow.sel.idle::after{background:var(--q-selRuleIdle)}
.arow.sel::before,.arow.sel+.arow::before{display:none}
.arow .an{flex:1;min-width:0;display:flex;flex-direction:column}
.arow .an b{font:600 13px/16px var(--q-sans);color:var(--q-ink)}.arow .an i{font-style:normal;font:var(--q-font-snippet);color:var(--q-ink2);display:flex;gap:4px;align-items:center}
.arow .an i.bad{color:var(--q-danger)}
.arow .ast{display:flex;gap:5px;align-items:center;font:var(--q-font-snippet);color:var(--q-ink2)}
.arow .ast .sym{color:var(--q-success)}
.sq{width:24px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:var(--q-raised);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);color:var(--q-ink2)}
.sq:first-child{border-radius:5px 0 0 5px}.sq:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.sform{display:grid;grid-template-columns:140px 1fr;grid-auto-rows:minmax(28px,auto);gap:12px 12px;align-items:center;margin-top:18px;font:var(--q-font-body);color:var(--q-ink)}
.sform > span:nth-child(odd){text-align:right}
.sform > span:nth-child(even){justify-self:start}
.sform .hr{height:1px;background:var(--q-rule);margin:2px 0}
.sform.det{margin-top:{{layout.settings.detailTop}}px;grid-auto-rows:{{layout.settings.detailRow}}px;row-gap:0}

/* ----- component sheet ----- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.card{background:var(--q-paper);border-radius:12px;box-shadow:0 0 0 1px var(--studio-rule);padding:18px 20px 20px;color:var(--q-ink);position:relative;overflow:hidden}
.card.deskbg{background:var(--q-canvas)}
.card.sheetbg{background:var(--q-sheet)}
.card h3{font:600 15px/20px var(--q-serif);display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.card h3 code{color:var(--q-ink3);font-size:10.5px}
.card .cap{font:var(--q-font-meta);color:var(--q-ink3);margin-bottom:14px;max-width:560px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.st{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center}
.st > .lb{font:var(--q-font-meta);color:var(--q-ink3)}
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font:var(--q-font-meta);color:var(--q-ink3);display:block;margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.listbox{width:364px;background:var(--q-paper);box-shadow:0 0 0 1px var(--q-rule);border-radius:8px;overflow:hidden}
.ann{font:var(--q-font-meta);color:var(--q-ink3)}
.ic-panel{background:var(--q-paper);color:var(--q-ink)}

/* ----- component helpers ----- */
.railspec{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;background:var(--q-spine);border-radius:8px;padding:16px 8px;box-shadow:0 0 0 1px var(--q-rule)}
.railspec > div{display:flex;flex-direction:column;align-items:center;gap:8px}
.railspec b{font:var(--q-font-meta);color:var(--q-ink3);font-weight:400;text-align:center}
.rt2{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;color:var(--q-ink2)}

.avz{width:var(--d);height:var(--d);border-radius:50%;background:var(--face);color:var(--avink);font:600 calc(var(--d) * 0.42)/var(--d) var(--q-serif);text-align:center;display:inline-block;flex:none}

.tint{display:flex;align-items:center;gap:10px;font:12px/16px var(--q-sans);color:var(--studio-ink)}
.avx{width:36px;height:36px;border-radius:50%;background:var(--face);color:var(--avink);font:600 15px/36px var(--q-serif);text-align:center}
.ts{display:grid;grid-template-columns:130px 190px 1fr;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--studio-rule);color:var(--studio-ink)}

.ig b{font:500 12px/15px var(--q-sans)}.ig code{font-size:10px;color:var(--studio-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 16px}
.gs{color:var(--studio-ink)}.gs .gsz{display:flex;gap:16px;align-items:flex-end;height:40px;margin-bottom:8px}
.gs p{font:11px/15px var(--q-sans);color:var(--studio-ink2);margin-top:4px}
.mc{display:flex;flex-direction:column;gap:4px;color:var(--studio-ink);font:12px/16px var(--q-sans)}.mc svg{width:100px;height:100px}.mc code{color:var(--studio-ink2)}
.fcard{background:var(--studio-card);border-radius:12px;padding:20px;box-shadow:0 0 0 1px var(--studio-rule)}
.fcard h3{font:600 15px/20px var(--q-serif);color:var(--studio-ink);margin-bottom:12px}
/* ----- 1.1 additions ----- */
.rt2.prs .face::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--q-pressed)}

.skrow{position:relative;height:48px;box-shadow:inset 0 -1px 0 var(--q-rule);background:var(--q-paper)}

.notice{display:flex;align-items:center;gap:8px;min-height:32px;border-radius:6px;padding:0 6px 0 10px;font:var(--q-font-snippet);line-height:16px;color:var(--q-ink);background:var(--q-warningWash)}

/* ----- 1.2 additions ----- */
.cfv{flex:1;align-self:stretch;display:flex;align-items:center;gap:{{layout.token.gap}}px;margin:{{layout.composer.focusRingInsetY}}px {{layout.composer.focusRingButtonGap}}px {{layout.composer.focusRingInsetY}}px -6px;padding:0 6px;border-radius:{{layout.composer.focusRingRadius}}px;min-width:0}

.ac{width:{{layout.autocomplete.width}}px;padding:{{layout.autocomplete.pad}}px;border-radius:{{layout.autocomplete.radius}}px;background:var(--q-raised);box-shadow:var(--q-e2);font:var(--q-font-body);color:var(--q-ink)}
.acr{position:relative;display:flex;align-items:center;gap:{{layout.autocomplete.avatarGap}}px;height:{{layout.autocomplete.row}}px;padding:0 {{layout.autocomplete.keycapTrailing}}px 0 {{layout.autocomplete.rowPadX}}px;border-radius:{{layout.autocomplete.rowRadius}}px;white-space:nowrap;overflow:hidden}

.oform{display:grid;grid-template-columns:{{layout.settings.labelColumn}}px {{layout.settings.fieldWidth}}px;column-gap:{{layout.settings.labelGap}}px;align-items:center;font:var(--q-font-body);color:var(--q-ink)}

}

.inv .iw{margin-top:{{layout.invitation.whenTop}}px;font:var(--q-font-body);color:var(--q-ink)}
.inv .ie{font:var(--q-font-snippet);color:var(--q-ink3)}
.inv .ir{margin-top:{{layout.invitation.whenTop}}px;font:var(--q-font-snippet);color:var(--q-ink2)}
.inv dl{margin:{{layout.invitation.detailsTop}}px 0 0;display:grid;grid-template-columns:{{layout.invitation.labelColumn}}px minmax(0,1fr);row-gap:{{layout.invitation.rowGap}}px;font:var(--q-font-snippet);line-height:16px}
.inv dt{color:var(--q-ink3)}.inv dd{margin:0;color:var(--q-ink2)}.inv dd .lk{color:var(--q-accent)}
.inv .ia{margin-top:{{layout.invitation.actionsTop}}px;padding-top:{{layout.invitation.actionsPad}}px;border-top:1px solid var(--q-rule);display:flex;align-items:center;gap:{{layout.invitation.answerGap}}px}
.inv .ia .linkb{margin-left:auto;font:var(--q-font-label)}
.ans{display:inline-flex;align-items:center;gap:6px;height:{{layout.button.small.height}}px;padding:0 9px;border-radius:5px;background:var(--q-raised);box-shadow:inset 0 0 0 1px var(--q-ruleStrong);font:var(--q-font-label);color:var(--q-ink)}
.ans.on{background:var(--q-accentWash);box-shadow:none;color:var(--q-accent);font:var(--q-font-labelStrong);padding-left:7px}
.ans.on.hov{background:var(--q-accentWashHover)}
.ans.foc{box-shadow:inset 0 0 0 1px var(--q-ruleStrong),0 0 0 1px var(--q-sheet),0 0 0 3px var(--q-focus)}
.inv .banner{height:auto;min-height:32px;margin-top:{{layout.invitation.noticeTop}}px;align-items:flex-start}
.inv .banner .sym{margin-top:9px}.inv .banner .txt{white-space:normal;padding:8px 0}.inv .banner .linkb{align-self:flex-end;margin-bottom:4px}
.hscroll{position:absolute;left:0;right:0;bottom:2px;height:4px;padding:0 2px}
.hscroll i{display:block;height:4px;border-radius:2px;background:var(--q-ink3);opacity:.6}
/* the Themes band (§4.16): the main window at half size, per theme and appearance */
.tband{display:grid;gap:28px}
.tbname{font:var(--q-font-snippet);color:var(--studio-ink2);margin-bottom:10px}
.tbname b{font:600 17px/22px var(--q-serif);color:var(--studio-ink);margin-right:12px}
.tbcells{display:grid;grid-template-columns:630px 630px;gap:20px}
.tbk{font:var(--q-font-runningHead);letter-spacing:.6px;text-transform:uppercase;color:var(--studio-ink2);margin-bottom:6px}

.tbwin>.win{transform:scale(.4921875);transform-origin:0 0;box-shadow:none}
